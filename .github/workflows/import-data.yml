name: Import RappelConso Data

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      target_count:
        description: "Nombre minimum de fiches a recuperer"
        default: "1600"
      category:
        description: "Filtre categorie (laisser vide pour toutes)"
        default: ""

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Import des fiches officielles
        env:
          TARGET_COUNT: ${{ github.event.inputs.target_count || '1600' }}
          CATEGORY: ${{ github.event.inputs.category || '' }}
        run: node scripts/import-recalls.mjs
      - name: Commit des donnees mises a jour
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/recalls.json
          git diff --cached --quiet || git commit -m "chore: mise a jour automatique des rappels (RappelConso)"
          git push
